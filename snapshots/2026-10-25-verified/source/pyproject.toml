[project]
name = "memory-writer-eval"
version = "0.1.0"
description = "A small, transparent evaluation harness for LLM memory writers"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.99.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
]

[project.scripts]
memory-eval = "memory_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_eval"]
